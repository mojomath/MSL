[workspace]
authors = ["shivasankar <shivasankar.ka@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max/"]
name = "gsl-bindings"
platforms = ["osx-arm64"]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "msl"
version = "0.9.0"

[package.build]
backend = {name = "pixi-build-mojo", version = "0.*", channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]}
[package.build.config.pkg]
name = "msl"

[package.host-dependencies]
mojo = "26.2.*"
gsl = ">=2.8,<3"

[package.build-dependencies]
mojo = "26.2.*"
gsl = ">=2.8,<3"

[package.run-dependencies]
mojo = "26.2.*"
gsl = ">=2.8,<3"

[tasks]
format = "mojo format ./msl"
package = "mojo package msl"
test = "bash tests/tests.sh"

[dependencies]
mojo = ">=0.26.2.0,<0.27"
gsl = ">=2.8,<3"
