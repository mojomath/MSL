[workspace]
authors = ["shivasankar <shivasankar.ka@gmail.com>"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
name = "gsl-bindings"
platforms = ["osx-arm64"]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "msl"
version = "0.1.0"

[package.build]
backend = {name = "pixi-build-mojo", version = "0.*", channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]}
[package.build.config.pkg]
name = "msl"

[package.host-dependencies]
mojo = "==1.0.0b1"

[package.build-dependencies]
mojo = "==1.0.0b1"

[package.run-dependencies]
mojo = "==1.0.0b1"

[tasks]
format = "mojo format ./msl"
package = "mojo package msl"
tests = "bash tests/tests.sh"

[dependencies]
mojoblas = {git = "https://github.com/shivasankarka/mojoBLAS.git", branch = "main"}
mojo = ">=1.0.0b1,<2"
