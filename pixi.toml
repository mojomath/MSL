[workspace]
authors = ["shivasankar <shivasankar.ka@gmail.com>"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
name = "msl"
platforms = ["osx-arm64"]
version = "0.2.0"
preview = ["pixi-build"]

[package]
name = "msl"
version = "0.2.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*"}

[package.build.config.pkg]
name = "msl"

[package.host-dependencies]
mojo = "==1.0.0"
mojoblas = {git = "https://github.com/shivasankarka/mojoBLAS.git", branch = "main"}

[package.build-dependencies]
mojo = "==1.0.0"
mojoblas = {git = "https://github.com/shivasankarka/mojoBLAS.git", branch = "main"}

[package.run-dependencies]
mojo = "==1.0.0"
mojoblas = {git = "https://github.com/shivasankarka/mojoBLAS.git", branch = "main"}

[tasks]
format = "mojo format ./msl"
package = "mojo precompile msl"
tests = "bash tests/tests.sh"

[dependencies]
mojo = ">=1.0.0,<2"
mojoblas = {git = "https://github.com/shivasankarka/mojoBLAS.git", branch = "main"}
